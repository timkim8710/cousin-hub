<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousin Crew Hub | Vibe Check 🇰🇪</title>
    
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>

    <link rel="stylesheet" href="style.css?v=7.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-glow"></div>

    <div class="profile-section">
        <div class="avatar-glow"><div class="profile-pic"></div></div>
        <h2 class="glitch-text">COUSIN CREW HUB</h2>
        <div class="badge">EST. 2026</div>
    </div>

    <div class="links-container">
        <div class="link-card registry-card">
            <h3 class="card-label">CREW LEADERS</h3>
            <div class="crew-list">
                <div class="person"><b>Blessing</b> <span class="role">Chairman</span></div>
                <div class="person"><b>Darlene</b> <span class="role">Secretary</span></div>
                <div class="person"><b>Jedidiah</b> <span class="role">Treasure</span></div>
                <div class="person"><b>Nimrod</b> <span class="role">Socials</span></div>
                <div class="person"><b>Timon</b> <span class="role dev">Developer</span></div>
            </div>
        </div>
        <a href="https://whatsapp.com/channel/0029Vb7QkV14dTnBkzndP63f" class="neon-btn whatsapp" target="_blank"><span>📢 WHATSAPP CHANNEL</span></a>
    </div>

    <div id="video-feed" class="shorts-container">
        <div class="shorts-header">
            <span>CREW SHORTS</span>
            <div class="header-btns">
                <button class="upload-btn" onclick="openUploadWidget()">➕ Upload</button>
                <button class="close-shorts" onclick="toggleVideos()">✕</button>
            </div>
        </div>
        <div id="shorts-area" class="video-scroll-area">
            </div>
    </div>

    <div id="call-container"></div>

    <div class="dock-container">
        <div class="dock">
            <div class="dock-item" onclick="location.reload()"><img src="https://img.icons8.com/fluency/48/home.png"></div>
            <div class="dock-item" onclick="toggleVideos()"><img src="https://img.icons8.com/fluency/48/video-playlist.png"></div>
            <div class="dock-item main" onclick="toggleChat()">
                <img src="https://img.icons8.com/fluency/48/speech-bubble.png">
                <div class="ping"></div>
            </div>
            <div class="dock-item" onclick="startGlobalCall()"><img src="https://img.icons8.com/fluency/48/video-call.png"></div>
            <a href="https://www.instagram.com/vetruk_x" class="dock-item" target="_blank"><img src="https://img.icons8.com/fluency/48/instagram-new.png"></a>
        </div>
    </div>

    <div id="chat-box" class="chat-vibe">
        <div class="chat-head">
            <div class="user-info"><div class="status-dot"></div><span>CREW LOBBY</span></div>
            <button class="close-chat" onclick="toggleChat()">✕</button>
        </div>
        <div id="chat-window" class="chat-body"></div>
        <div class="chat-footer">
            <div class="input-pill">
                <input type="text" id="user-name" placeholder="Name" maxlength="10">
                <input type="text" id="user-msg" placeholder="Message..." maxlength="100">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXArPj4WErtRkb2qfaDueaWZm9tdAbSGI",
            authDomain: "street-humor-hub.firebaseapp.com",
            projectId: "street-humor-hub",
            storageBucket: "street-humor-hub.firebasestorage.app",
            messagingSenderId: "1010209458338",
            appId: "1:1010209458338:web:548911c5d0e36d1e3ceffb",
            databaseURL: "https://street-humor-hub-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, "global_chat");
        const shortsRef = ref(db, "crew_shorts");

        const uNameInput = document.getElementById("user-name");

        // CLOUDINARY UPLOAD WIDGET
        window.openUploadWidget = function() {
            const author = uNameInput.value.trim() || "Crew Member";
            cloudinary.openUploadWidget({
                cloudName: "dfx2eovxk",
                uploadPreset: "icb9pwjk",
                sources: ["local", "camera"],
                clientAllowedFormats: ["mp4", "mov", "webm"],
                maxFileSize: 50000000,
                multiple: false,
                theme: "minimal"
            }, (error, result) => {
                if (!error && result && result.event === "success") {
                    push(shortsRef, { 
                        url: result.info.secure_url, 
                        user: author, 
                        timestamp: serverTimestamp() 
                    });
                }
            });
        };

        // SYNC SHORTS FROM FIREBASE
        onChildAdded(shortsRef, (snapshot) => {
            const data = snapshot.val();
            const shortHtml = `
                <div class="short-card">
                    <video src="${data.url}" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                    <div class="video-info"><p><b>@${data.user}</b> • New Vibe 🇰🇪</p></div>
                </div>`;
            document.getElementById('shorts-area').insertAdjacentHTML('afterbegin', shortHtml);
        });

        // Chat Logic
        window.toggleChat = () => document.getElementById('chat-box').classList.toggle('active');
        window.toggleVideos = () => {
            const v = document.getElementById('video-feed');
            v.style.display = (v.style.display === 'flex') ? 'none' : 'flex';
            if(v.style.display === 'none') v.querySelectorAll('video').forEach(vid => vid.pause());
        };

        document.getElementById("send-btn").onclick = () => {
            const text = document.getElementById("user-msg").value.trim();
            if (text !== "") {
                push(chatRef, { name: uNameInput.value || "Guest", text, timestamp: serverTimestamp() });
                document.getElementById("user-msg").value = "";
            }
        };

        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${data.name === uNameInput.value ? 'me' : 'others'}`;
            msgDiv.innerHTML = `<b>${data.name}</b> ${data.text}`;
            document.getElementById("chat-window").appendChild(msgDiv);
            document.getElementById("chat-window").scrollTop = document.getElementById("chat-window").scrollHeight;
        });

        // Video Call
        window.startGlobalCall = async function() {
            const container = document.getElementById('call-container');
            container.style.display = 'block';
            const { ZegoUIKitPrebuilt } = await import('https://unpkg.com/@zegocloud/zego-uikit-prebuilt-web@latest/index.js');
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(1623142508, "1b29c844532e8ab6c62ce95f6d452400", "CousinCrew_Lobby", "U"+Math.random(), uNameInput.value || "Guest");
            const zp = ZegoUIKitPrebuilt.create(kitToken);
            zp.joinRoom({ container, scenario: { mode: ZegoUIKitPrebuilt.GroupCall }, onLeaveRoom: () => location.reload() });
        }
    </script>
</body>
</html>
