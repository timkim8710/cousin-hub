<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousin Crew Hub | Synthetic</title>
    <style>
        :root {
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--primary-neon);
        }

        /* Glassmorphism Grid */
        .hub-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1200px;
            padding-bottom: 50px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, border 0.3s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card:hover {
            transform: translateY(-10px);
            border: 1px solid var(--primary-neon);
        }

        .role-tag {
            display: inline-block;
            background: var(--secondary-neon);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Countdown Section */
        #countdown-timer {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            color: var(--primary-neon);
            margin-top: 10px;
        }

        /* Responsive Gallery */
        .gallery-preview {
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cousin Crew Hub</h1>
        <div id="countdown-timer">SYNCING...</div>
    </header>

    <main class="hub-container" id="members-grid">
        </main>

    <script>
        // Data for the Hub
        const crew = [
            { name: "Blessing", role: "Chairman", status: "Active" },
            { name: "Timon", role: "Developer", status: "Online" },
            { name: "Darlene", role: "Secretary", status: "Active" },
            { name: "Jedidiah", role: "Treasure", status: "Active" },
            { name: "Nimrod", role: "Social Media", status: "Online" }
        ];

        const grid = document.getElementById('members-grid');

        // Render Cards
        crew.forEach(member => {
            const card = document.createElement('div');
            card.className = 'glass-card';
            card.innerHTML = `
                <div class="role-tag">${member.role}</div>
                <h2>${member.name}</h2>
                <p>Status: <span style="color: var(--primary-neon)">${member.status}</span></p>
                <div class="gallery-preview">Member Asset Loaded</div>
            `;
            grid.appendChild(card);
        });

        // Simple Countdown logic (Target: Next Reunion)
        function updateTimer() {
            const now = new Date().getTime();
            const target = new Date("Dec 25, 2026 00:00:00").getTime();
            const diff = target - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            
            document.getElementById('countdown-timer').innerText = 
                `REUNION IN: ${days}D ${hours}H`;
        }
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
