<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousin Crew Hub | Vibe Check 🇰🇪</title>
    
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>

    <link rel="stylesheet" href="style.css?v=8.5">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-glow"></div>

    <div id="auth-overlay" class="auth-screen">
        <div class="auth-card">
            <h2 class="glitch-text">CREW PORTAL</h2>
            <p>Join the lobby to see the vibes</p>
            <div class="auth-inputs">
                <input type="text" id="auth-name" placeholder="Full Name (e.g. Timon)">
                <input type="email" id="auth-email" placeholder="Email Address">
                <input type="password" id="auth-pass" placeholder="Password (Min 6 chars)">
            </div>
            <div class="auth-btns">
                <button onclick="handleSignUp()" class="auth-secondary">Join Crew</button>
                <button onclick="handleLogin()" class="auth-primary">Login</button>
            </div>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <div class="profile-section">
        <div class="avatar-glow"><div class="profile-pic"></div></div>
        <h2 class="glitch-text">COUSIN CREW HUB</h2>
        <div class="badge">EST. 2026</div>
    </div>

    <div class="links-container">
        <div class="link-card registry-card">
            <h3 class="card-label">CREW LEADERS</h3>
            <div class="crew-list">
                <div class="person"><b>Blessing</b> <span class="role">Chairman</span></div>
                <div class="person"><b>Darlene</b> <span class="role">Secretary</span></div>
                <div class="person"><b>Jedidiah</b> <span class="role">Treasure</span></div>
                <div class="person"><b>Nimrod</b> <span class="role">Socials</span></div>
                <div class="person"><b>Timon</b> <span class="role dev">Developer</span></div>
            </div>
        </div>
        <a href="https://whatsapp.com/channel/0029Vb7QkV14dTnBkzndP63f" class="neon-btn whatsapp" target="_blank"><span>📢 WHATSAPP CHANNEL</span></a>
    </div>

    <div id="video-feed" class="shorts-container">
        <div class="shorts-header">
            <span>CREW SHORTS</span>
            <div class="header-btns">
                <button class="upload-btn" onclick="openUploadWidget()">➕ Upload</button>
                <button class="close-shorts" onclick="toggleVideos()">✕</button>
            </div>
        </div>
        <div id="shorts-area" class="video-scroll-area"></div>
    </div>

    <div id="call-container"></div>

    <div class="dock-container">
        <div class="dock">
            <div class="dock-item" onclick="location.reload()"><img src="https://img.icons8.com/fluency/48/home.png"></div>
            <div class="dock-item" onclick="toggleVideos()"><img src="https://img.icons8.com/fluency/48/video-playlist.png"></div>
            <div class="dock-item main" onclick="toggleChat()"><img src="https://img.icons8.com/fluency/48/speech-bubble.png"><div class="ping"></div></div>
            <div class="dock-item" onclick="startGlobalCall()"><img src="https://img.icons8.com/fluency/48/video-call.png"></div>
            <div class="dock-item" onclick="handleLogout()"><img src="https://img.icons8.com/fluency/48/exit.png"></div>
        </div>
    </div>

    <div id="chat-box" class="chat-vibe">
        <div class="chat-head"><span>CREW LOBBY</span><button class="close-chat" onclick="toggleChat()">✕</button></div>
        <div id="chat-window" class="chat-body"></div>
        <div class="chat-footer">
            <div class="input-pill">
                <input type="text" id="user-msg" placeholder="Type a message..." maxlength="100">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXArPj4WErtRkb2qfaDueaWZm9tdAbSGI",
            authDomain: "street-humor-hub.firebaseapp.com",
            projectId: "street-humor-hub",
            storageBucket: "street-humor-hub.firebasestorage.app",
            messagingSenderId: "1010209458338",
            appId: "1:1010209458338:web:548911c5d0e36d1e3ceffb",
            databaseURL: "https://street-humor-hub-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const chatRef = ref(db, "global_chat");
        const shortsRef = ref(db, "crew_shorts");

        let currentUsername = "Guest";

        // --- AUTH LOGIC ---
        window.handleSignUp = () => {
            const name = document.getElementById('auth-name').value.trim();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const errorLabel = document.getElementById('auth-error');

            if(!name || !email || !pass) { errorLabel.innerText = "Fill in all fields!"; return; }

            createUserWithEmailAndPassword(auth, email, pass).then(async (res) => {
                await updateProfile(res.user, { displayName: name });
                location.reload(); // Refresh to lock in the new name
            }).catch(err => errorLabel.innerText = err.message);
        };

        window.handleLogin = () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => {
                document.getElementById('auth-error').innerText = err.message;
            });
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-overlay').style.display = 'none';
                currentUsername = user.displayName || "Crew Member";
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        // --- SHORTS & UPLOAD ---
        window.openUploadWidget = () => {
            cloudinary.openUploadWidget({
                cloudName: "dfx2eovxk", uploadPreset: "icb9pwjk", theme: "minimal"
            }, (error, result) => {
                if (!error && result.event === "success") {
                    push(shortsRef, { url: result.info.secure_url, user: currentUsername, timestamp: serverTimestamp() });
                }
            });
        };

        onChildAdded(shortsRef, (snap) => {
            const data = snap.val();
            const html = `<div class="short-card"><video src="${data.url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
                          <div class="video-info"><p><b>@${data.user}</b> • Hub Viral</p></div></div>`;
            document.getElementById('shorts-area').insertAdjacentHTML('afterbegin', html);
        });

        // --- CHAT LOGIC ---
        document.getElementById("send-btn").onclick = () => {
            const msg = document.getElementById("user-msg").value.trim();
            if (msg) {
                push(chatRef, { name: currentUsername, text: msg, timestamp: serverTimestamp() });
                document.getElementById("user-msg").value = "";
            }
        };

        onChildAdded(chatRef, (snap) => {
            const d = snap.val();
            const div = document.createElement("div");
            div.className = `msg ${d.name === currentUsername ? 'me' : 'others'}`;
            div.innerHTML = `<b>${d.name}</b> ${d.text}`;
            document.getElementById("chat-window").appendChild(div);
            document.getElementById("chat-window").scrollTop = document.getElementById("chat-window").scrollHeight;
        });

        // --- UI HELPERS ---
        window.toggleChat = () => document.getElementById('chat-box').classList.toggle('active');
        window.toggleVideos = () => {
            const f = document.getElementById('video-feed');
            f.style.display = f.style.display === 'flex' ? 'none' : 'flex';
            if(f.style.display === 'none') f.querySelectorAll('video').forEach(vid => vid.pause());
        };

        window.startGlobalCall = async () => {
            const c = document.getElementById('call-container'); c.style.display = 'block';
            const { ZegoUIKitPrebuilt } = await import('https://unpkg.com/@zegocloud/zego-uikit-prebuilt-web@latest/index.js');
            const kit = ZegoUIKitPrebuilt.generateKitTokenForTest(1623142508, "1b29c844532e8ab6c62ce95f6d452400", "CousinCrew", "U"+Math.random(), currentUsername);
            ZegoUIKitPrebuilt.create(kit).joinRoom({ container: c, scenario: { mode: ZegoUIKitPrebuilt.GroupCall }, onLeaveRoom: () => location.reload() });
        };
    </script>
</body>
</html>
