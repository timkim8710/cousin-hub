<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Core Connect: The elite ecosystem for global collaboration and team networking.">
    <meta name="theme-color" content="#00f0ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Core Connect | CC Ecosystem</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
    <link rel="stylesheet" href="style.css?v=13.0">
</head>
<body>

    <div class="bg-glow"></div>

    <div id="auth-overlay" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">CC</div>
            <h2>CORE CONNECT</h2>
            <p>Access the global collaboration suite</p>
            <div class="auth-inputs">
                <input type="text" id="auth-name" placeholder="Full Name">
                <input type="email" id="auth-email" placeholder="Email Address">
                <input type="password" id="auth-pass" placeholder="Security Password">
            </div>
            <div class="auth-btns">
                <button onclick="handleSignUp()" class="auth-secondary">Join</button>
                <button onclick="handleLogin()" class="auth-primary">Sign In</button>
            </div>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <header class="app-header">
        <div class="avatar-glow"></div>
        <h1 class="glitch-text">CORE CONNECT</h1>
        <span class="version-tag">STABLE V13.0</span>
    </header>

    <main class="content-wrapper">
        <button id="pwa-install-btn" class="action-btn" style="display:none; background: var(--cyan); color: #000; margin-bottom: 20px;">
            INSTALL CC ON HOME SCREEN 📲
        </button>

        <div class="link-card pro-card">
            <div class="pro-badge">PREMIUM</div>
            <h3>Upgrade to Pro</h3>
            <p>Get verified badges, HD video uploads, and priority support.</p>
            <button class="upgrade-btn" onclick="alert('Payment Gateway: Connecting to M-PESA/Card...')">GET PRO 🚀</button>
        </div>

        <div class="link-card">
            <h3 class="card-label">ACTIVE NODES</h3>
            <div class="node-list">
                <div class="node"><b>Administrator</b><span class="status-online">Online</span></div>
                <div class="node"><b>Operations</b><span class="status-online">Online</span></div>
                <div class="node"><b>Development</b><span class="status-online">Online</span></div>
            </div>
        </div>

        <button class="action-btn" onclick="window.open('https://whatsapp.com/channel/0029Vb7QkV14dTnBkzndP63f')">
            OFFICIAL ANNOUNCEMENTS
        </button>
    </main>

    <nav class="dock-container">
        <div class="dock">
            <div class="dock-item" onclick="location.reload()"><img src="https://img.icons8.com/fluency/48/home.png" alt="Home"></div>
            <div class="dock-item" onclick="toggleVideos()"><img src="https://img.icons8.com/fluency/48/video-playlist.png" alt="Feed"></div>
            <div class="dock-item main" onclick="toggleChat()"><img src="https://img.icons8.com/fluency/48/speech-bubble.png" alt="Chat"><div class="ping"></div></div>
            <div class="dock-item" onclick="startGlobalCall()"><img src="https://img.icons8.com/fluency/48/video-call.png" alt="Call"></div>
            <div class="dock-item" onclick="handleLogout()"><img src="https://img.icons8.com/fluency/48/exit.png" alt="Exit"></div>
        </div>
    </nav>

    <div id="chat-box" class="chat-vibe">
        <div class="chat-header"><span>LOBBY</span><button onclick="toggleChat()">✕</button></div>
        <div id="chat-window" class="chat-body"></div>
        <div class="chat-footer">
            <div class="input-pill">
                <input type="text" id="user-msg" placeholder="Broadcast a message..." maxlength="120">
                <button id="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <div id="video-feed" class="shorts-container">
        <div class="shorts-header">
            <button class="upload-btn" onclick="openUploadWidget()">UPLOAD CC</button>
            <button class="close-btn" onclick="toggleVideos()">✕</button>
        </div>
        <div id="shorts-area" class="video-scroll-area"></div>
    </div>

    <div id="call-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXArPj4WErtRkb2qfaDueaWZm9tdAbSGI",
            authDomain: "street-humor-hub.firebaseapp.com",
            projectId: "street-humor-hub",
            storageBucket: "street-humor-hub.firebasestorage.app",
            messagingSenderId: "1010209458338",
            appId: "1:1010209458338:web:548911c5d0e36d1e3ceffb",
            databaseURL: "https://street-humor-hub-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const chatRef = ref(db, "global_chat");
        const shortsRef = ref(db, "crew_shorts");

        let currentUsername = "User";

        // 1. PWA INSTALL LOGIC (CHROME)
        let deferredPrompt;
        const installBtn = document.getElementById('pwa-install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.onclick = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        };

        // 2. SERVICE WORKER
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // 3. AUTHENTICATION
        window.handleSignUp = () => {
            const n = document.getElementById('auth-name').value;
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            if(!n || !e || p.length < 6) return alert("Details required. Password 6+ chars.");
            createUserWithEmailAndPassword(auth, e, p).then(async (res) => {
                await updateProfile(res.user, { displayName: n });
                location.reload();
            }).catch(err => document.getElementById('auth-error').innerText = err.message);
        };

        window.handleLogin = () => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => document.getElementById('auth-error').innerText = err.message);
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-overlay').style.display = 'none';
                currentUsername = user.displayName || "Member";
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        // 4. CHAT ENGINE
        document.getElementById("send-btn").onclick = () => {
            const text = document.getElementById("user-msg").value.trim();
            if (text) {
                push(chatRef, { name: currentUsername, text, timestamp: serverTimestamp() });
                document.getElementById("user-msg").value = "";
            }
        };

        onChildAdded(chatRef, (snap) => {
            const d = snap.val();
            const div = document.createElement("div");
            div.className = `msg ${d.name === currentUsername ? 'me' : 'others'}`;
            div.innerHTML = `<b>${d.name}</b> ${d.text}`;
            document.getElementById("chat-window").appendChild(div);
            document.getElementById("chat-window").scrollTop = document.getElementById("chat-window").scrollHeight;
        });

        // 5. VIDEO & UI HELPERS
        window.toggleChat = () => document.getElementById('chat-box').classList.toggle('active');
        window.toggleVideos = () => {
            const v = document.getElementById('video-feed');
            v.style.display = (v.style.display === 'flex') ? 'none' : 'flex';
        };

        window.openUploadWidget = () => {
            cloudinary.openUploadWidget({ cloudName: "dfx2eovxk", uploadPreset: "icb9pwjk" }, (err, res) => {
                if (!err && res.event === "success") push(shortsRef, { url: res.info.secure_url, user: currentUsername });
            });
        };

        onChildAdded(shortsRef, (snap) => {
            const data = snap.val();
            const html = `<div class="short-card"><video src="${data.url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div class="video-info"><b>@${data.user}</b></div></div>`;
            document.getElementById('shorts-area').insertAdjacentHTML('afterbegin', html);
        });

        window.startGlobalCall = async () => {
            const c = document.getElementById('call-container'); c.style.display = 'block';
            const { ZegoUIKitPrebuilt } = await import('https://unpkg.com/@zegocloud/zego-uikit-prebuilt-web@latest/index.js');
            const kit = ZegoUIKitPrebuilt.generateKitTokenForTest(1623142508, "1b29c844532e8ab6c62ce95f6d452400", "CoreConnect", "U"+Math.random(), currentUsername);
            ZegoUIKitPrebuilt.create(kit).joinRoom({ container: c, scenario: { mode: ZegoUIKitPrebuilt.GroupCall }, onLeaveRoom: () => location.reload() });
        };
    </script>
</body>
</html>
